name: Upload Data to Cloudflare R2

on:
  push:
    branches:
      - main

concurrency:
  group: upload-to-r2-main
  cancel-in-progress: false

jobs:
  upload-to-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Fetch repository metadata without image blobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            clone --filter=blob:none --no-checkout --no-tags --sparse \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git sparse-checkout set --no-cone \
            generate_manifest.py \
            sync_changed_data.py \
            data/manifest.json
          git checkout --detach "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH_HEADER}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate manifest from Git tree
        run: python generate_manifest.py --git-tree "$GITHUB_SHA"

      - name: Commit updated manifest.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json
          if git diff --staged --quiet; then
            echo "manifest.json unchanged, skipping commit."
          else
            git commit -m "chore: auto-update manifest.json [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Verify AWS CLI installation
        run: aws --version

      - name: Upload changed data files to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPLOAD_R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPLOAD_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.UPLOAD_R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.UPLOAD_R2_ACCOUNT_ID }}
          GIT_BEFORE: ${{ github.event.before }}
          GIT_AFTER: ${{ github.sha }}
        run: |
          python sync_changed_data.py \
            --before "$GIT_BEFORE" \
            --after "$GIT_AFTER" \
            --bucket "$R2_BUCKET" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Upload current manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPLOAD_R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPLOAD_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.UPLOAD_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.UPLOAD_R2_BUCKET }}
        run: |
          aws s3 cp data/manifest.json "s3://${R2_BUCKET}/manifest.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control "public,max-age=604800,stale-while-revalidate=86400" \
            --only-show-errors
